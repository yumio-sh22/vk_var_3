name: downloads

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-rag_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - type: volume
        source: rag_postgres_data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./sql/01_init.sql
        target: /docker-entrypoint-initdb.d/01_init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - type: volume
        source: rag_ollama_data
        target: /root/.ollama

volumes:
  rag_postgres_data:
    external: true
    name: downloads_rag_postgres_data

  rag_ollama_data:
    external: true
    name: downloads_rag_ollama_data
